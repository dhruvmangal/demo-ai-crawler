version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crawler_postgres
    environment:
      POSTGRES_USER: crawler_user
      POSTGRES_PASSWORD: crawler_password
      POSTGRES_DB: crawler_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5.20-community
    container_name: crawler_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/crawler_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs

  llm:
    image: ollama/ollama:latest
    container_name: crawler_llm
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=qwen2.5:3b-instruct
    volumes:
      - ollamadata:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL"
        wait
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  crawler-app:
    build: .
    container_name: crawler_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - RECORDINGS_DIR=/usr/src/app/recordings
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres
      - neo4j

  # Admin backoffice, split into its own container/port from crawler-app: admin-routes.ts
  # has no auth and exposes every crawl's data, so it should stay off whatever port/host
  # the public API (crawler-app, port 3000) is reachable on. Shares Postgres, Neo4j and
  # the `recordings` volume with crawler-app, but is otherwise a standalone Express server
  # (see src/api/admin-server.ts) -- the admin UI itself (public/admin/) is unchanged.
  admin:
    build: .
    container_name: crawler_admin
    command: node dist/api/admin-server.js
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - RECORDINGS_DIR=/usr/src/app/recordings
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres
      - neo4j

  crawl-worker:
    build: .
    container_name: crawler_worker
    command: node dist/workers/crawl-worker.js
    environment:
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - OLLAMA_URL=http://llm:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - AI_SUMMARIZATION_ENABLED=true
    depends_on:
      - postgres
      - neo4j
      - llm

  # Playwright recording agent: polls workflow_runs, and for each step, an LLM-driven
  # orchestrator (workflow-orchestrator.ts) acts through a Playwright-MCP-style tool
  # surface (browser-tools.ts) to carry out and narrate the step in a fresh headless
  # browser, recording video and writing WebVTT captions from the agent's narration.
  # Shares the `recordings` volume with crawler-app, which serves it at /recordings/*.
  # Requires ANTHROPIC_API_KEY to be set in the shell environment or a .env file.
  workflow-agent-worker:
    build: .
    container_name: crawler_workflow_agent
    command: node dist/workers/workflow-agent-worker.js
    environment:
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - RECORDINGS_DIR=/usr/src/app/recordings
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres

  # Build-only container: bundles the Chrome extension (TypeScript + Three.js) into
  # ./extension/dist with esbuild, then exits. A browser extension can't "run" in a
  # headless container, so load ./extension/dist unpacked in Chrome after this builds
  # (chrome://extensions -> Developer mode -> Load unpacked). Rebuild after source
  # changes with: docker compose up -d --build extension-builder
  extension-builder:
    build: ./extension
    container_name: crawler_extension_builder
    volumes:
      - ./extension/dist:/app/dist

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  ollamadata:
  recordings:
