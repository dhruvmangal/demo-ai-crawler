version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crawler_postgres
    environment:
      POSTGRES_USER: crawler_user
      POSTGRES_PASSWORD: crawler_password
      POSTGRES_DB: crawler_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5.20-community
    container_name: crawler_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/crawler_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs

  llm:
    image: ollama/ollama:latest
    container_name: crawler_llm
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=qwen2.5:3b-instruct
    volumes:
      - ollamadata:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL"
        wait
    healthcheck:
      test: ["CMD", "sh", "-c", "ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  crawler-app:
    build: .
    container_name: crawler_app
    ports:
      - "3000:3000"
    # Auth/SMTP/OAuth secrets and other new config live in .env (gitignored, host-only --
    # see .env.example) rather than being inlined here. `environment:` below still wins
    # over env_file for the docker-internal hostnames (DATABASE_URL etc.).
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - RECORDINGS_DIR=/usr/src/app/recordings
      - CRAWL_TTL_HOURS=24
      - OLLAMA_URL=http://llm:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - OLLAMA_TIMEOUT_MS=180000
      # src/test-crawler.ts (make test) runs inside this container and now crawls via
      # crawler-engine over HTTP instead of importing PlaywrightCrawler in-process -- it
      # needs both the docker-network hostname of the mock CRM it starts on :4000 (crawler
      # -engine can't reach "localhost" inside crawler-app's container) and where to reach
      # crawler-engine itself.
      - MOCK_CRM_HOST=crawler_app
      - CRAWLER_ENGINE_URL=http://crawler-engine:3010
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres
      - neo4j
      - crawler-engine

  # Admin backoffice, split into its own container/port from crawler-app: admin-routes.ts
  # has no auth and exposes every crawl's data, so it should stay off whatever port/host
  # the public API (crawler-app, port 3000) is reachable on. Shares Postgres, Neo4j and
  # the `recordings` volume with crawler-app, but is otherwise a standalone Express server
  # (see src/api/admin-server.ts) -- the admin UI itself (public/admin/) is unchanged.
  admin:
    build: .
    container_name: crawler_admin
    command: node dist/api/admin-server.js
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - RECORDINGS_DIR=/usr/src/app/recordings
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres
      - neo4j

  crawl-worker:
    build: .
    container_name: crawler_worker
    command: node dist/workers/crawl-worker.js
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=crawler_neo4j_password
      - OLLAMA_URL=http://llm:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - AI_SUMMARIZATION_ENABLED=true
      - AI_CONCURRENCY=3
      - AI_MAX_HTML_CHARS=1500
      - OLLAMA_TIMEOUT_MS=180000
      - ENRICH_CONCURRENCY=2
      # crawl-worker no longer imports PlaywrightCrawler directly -- it POSTs to
      # crawler-engine and awaits the response. See src/crawler/crawler-engine-client.ts.
      - CRAWLER_ENGINE_URL=http://crawler-engine:3010
    depends_on:
      - postgres
      - neo4j
      - llm
      - crawler-engine

  # Crawl-time discovery service, pulled out of crawler-app/crawl-worker into its own
  # deployable container (see crawler-engine/ -- own package.json, own Dockerfile, no
  # dependency on the main app's DB/auth config). Drives a real Playwright browser to
  # discover a site's pages/UI; crawl-worker talks to it over HTTP (POST /crawls) instead
  # of running PlaywrightCrawler in-process. Stateless and long-lived per request -- see
  # crawler-engine/src/api/server.ts for why there's no job-tracking/polling here.
  crawler-engine:
    build: ./crawler-engine
    container_name: crawler_engine
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      # Same SSRF/CDP-allowlist env vars ssrf-guard.ts reads today -- crawler-engine
      # enforces this itself now, since it's the process actually driving the browser.
      - ALLOW_PRIVATE_CRAWL_TARGETS=${ALLOW_PRIVATE_CRAWL_TARGETS:-false}
      - CDP_ALLOWED_HOSTS=${CDP_ALLOWED_HOSTS:-}

  # Playwright recording agent: polls workflow_runs and dispatches each claimed run to
  # its own worker_threads Worker (recording-worker-thread.ts, up to RECORDING_CONCURRENCY
  # at once) so the poller itself never blocks. A workflow's first run generates and
  # persists a Playwright script via DeterministicScriptEngine -- no LLM call, no live
  # browser, resolved straight from the crawl-time knowledge base; every run of the same
  # workflow replays that persisted script with no LLM calls at all, unless a step throws,
  # in which case script-healer.ts repairs it in place, mid-recording, using the same
  # local Ollama model crawl-time summarization uses (not Anthropic), and the fix is
  # persisted for next time. Shares the `recordings` volume with crawler-app, which serves
  # it at /recordings/*.
  workflow-agent-worker:
    build: .
    container_name: crawler_workflow_agent
    command: node dist/workers/workflow-agent-worker.js
    environment:
      - DATABASE_URL=postgresql://crawler_user:crawler_password@postgres:5432/crawler_db
      - RECORDINGS_DIR=/usr/src/app/recordings
      - OLLAMA_URL=http://llm:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - OLLAMA_TIMEOUT_MS=180000
      - RECORDING_CONCURRENCY=2
    volumes:
      - recordings:/usr/src/app/recordings
    depends_on:
      - postgres
      - llm

  # Build-only container: bundles the Chrome extension (TypeScript + Three.js) into
  # ./extension/dist with esbuild, then exits. A browser extension can't "run" in a
  # headless container, so load ./extension/dist unpacked in Chrome after this builds
  # (chrome://extensions -> Developer mode -> Load unpacked). Rebuild after source
  # changes with: docker compose up -d --build extension-builder
  extension-builder:
    build: ./extension
    container_name: crawler_extension_builder
    volumes:
      - ./extension/dist:/app/dist

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  ollamadata:
  recordings:
